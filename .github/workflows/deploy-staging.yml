name: Deploy to Staging

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Aruba staging
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps          # o "sftp" se Aruba lo supporta su questo piano — verifica
          server-dir: /staging/
          exclude: |
            **/.git*
            **/.git*/**
            /content/**
            /site/accounts/**
            /site/cache/**
            /site/sessions/**
            /media/**
