title: Con il patrocinio

# Come nel sito (vedi patrocinio.php): in alto la descrizione, poi le
# locandine del carosello. Una colonna sola nel tab "Contenuto"; la SEO ha un tab a parte.
tabs:
  contenuto:
    label: Contenuto
    sections:
      descrizione:
        label: Descrizione pagina
        type: fields
        fields:
          payoff:
            extends: fields/payoff
          mission:
            extends: fields/mission
      files:
        label: Locandine
        type: files
        info: "{{ file.altInfo }}"
  seo:
    extends: tabs/seo
