title: Le Associazioni
icon: users

tabs:
  contenuto:
    label: Contenuto
    columns:
      main:
        width: 2/3
        sections:
          fields:
            type: fields
            fields:
              associazioni:
                label: Associazioni
                help: >
                  Ogni riga è un'associazione: carica prima logo e foto nella
                  sezione "File" qui a fianco, poi selezionali qui.
                type: structure
                columns:
                  logo:
                    width: 1/12
                  nome_completo:
                    width: 3/12
                  nome_breve:
                    width: 2/12
                  sito_web:
                    width: 2/12
                  delegate:
                    width: 2/12
                fields:
                  logo:
                    label: Logo
                    type: files
                    query: page.images
                    max: 1
                  nome_completo:
                    label: Nome completo
                    type: text
                    required: true
                  nome_breve:
                    label: Nome breve
                    type: text
                  sito_web:
                    label: Sito web
                    type: url
                  foto:
                    label: Foto significativa
                    type: files
                    imgtool: 640x200
                    query: page.images
                    max: 1
                  descrizione:
                    label: Descrizione significativa
                    extends: fields/rich-text
                  delegate:
                    label: Delegate collegate
                    help: >
                      Le persone dell'associazione — l'elenco si aggiorna da
                      solo, non serve toccarlo quando cambiano le persone.
                    type: multiselect
                    options:
                      type: query
                      query: kirby.collection('persone')
                      text: "{{ item.nome }} {{ item.cognome }}"
                      value: "{{ item.nome }} {{ item.cognome }}"
          contatti:
            extends: sections/contatti-globali
      sidebar:
        width: 1/3
        sections:
          file:
            label: File
            type: files
            help: |
              Carica qui loghi e foto, poi assegnali alle singole associazioni a sinistra. Il testo alternativo (Alt) non serve: si genera da solo come "logo-Nome associazione" e "foto-significativa-Nome associazione".
              **Logo: 320 px di larghezza** (meglio SVG, sfondo trasparente), oltre non serve: sul sito è alto al massimo ~90 px.
              **Foto significativa: 1280 × 400 px** (3,2:1, panoramica), oltre non serve: è il banner della finestra di dettaglio. Nello strumento immagini imposta **640 × 200** (200 è il minimo dell'altezza): il file esce 4 volte più grande (2560 × 800) e il sito lo riduce da solo.
  seo:
    extends: tabs/seo
