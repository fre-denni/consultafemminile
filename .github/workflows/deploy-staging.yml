name: Deploy to Production

on:
  workflow_dispatch:      # va lanciato manualmente da GitHub, tab "Actions"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Deploy to Aruba production
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update || true
          sudo apt-get install -y lftp
          EXCLUDES=""
          while IFS= read -r pattern; do
            [ -z "$pattern" ] && continue
            EXCLUDES="$EXCLUDES --exclude-glob $pattern"
          done < .deployignore
          lftp -c "
          set ftp:ssl-force true;
          set ftp:ssl-protect-data true;
          set ssl:verify-certificate no;
          open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" ftp://$FTP_SERVER;
          mirror --reverse --verbose $EXCLUDES . www.consultafemminile.org/
          "
