title: Output

# Una colonna sola, ma la testata (tipologia/descrizione a sinistra,
# autore/i/data/immagine a destra) usa la larghezza dei singoli campi
# per affiancarli due a due, nello stesso rapporto 1/2-1/2 di
# bits/article-header.css (testo a sinistra, immagine a destra). Il
# "gap" è un campo invisibile, serve solo a spingere "Immagine" sotto
# "Autore/i e Data" invece che sotto "Tipologia e Descrizione" — vedi
# doc Kirby sul campo "gap". NON riordinare questi campi senza
# aggiornare anche il gap, altrimenti le due colonne non tornano più
# allineate.
tabs:
  contenuto:
    label: Contenuto
    sections:
      testata:
        label: Testata
        type: fields
        fields:
          categoria:
            label: Tipologia
            help: Utile per SEO e filtraggio
            type: select
            width: 1/2
            options:
              - value: Contributo
                text: Contributo
              - value: Intervista
                text: Intervista
              - value: Dialogo
                text: Dialogo
              - value: Evento
                text: Evento
          autori:
            label: Autore/i
            help: >
              Un autore per riga. Se è un membro della Consulta il nome
              porta automaticamente alla pagina "Le Persone"; 
              altrimenti puoi aggiungere un link esterno
              facoltativo (es. il sito o il profilo della persona).
            type: structure
            width: 1/2
            columns:
              nome: {}
              membro_consulta:
                width: 1/4
              link:
                width: 1/4
            fields:
              nome:
                label: Nome
                type: text
                required: true
              membro_consulta:
                label: Membro della Consulta
                type: toggle
                default: true
              link:
                label: Link esterno
                help: Per chi non è membro.
                type: url
                when:
                  membro_consulta: false
          intro:
            label: Descrizione
            extends: fields/rich-text-inline
            width: 1/2
          data:
            label: Data
            type: date
            width: 1/2
          immagineGap:
            type: gap
            width: 1/2
          immagine:
            label: Immagine
            help: |
              Inserisci un immagine significativa o falla generare dal tool.
            type: files
            info: "{{ file.alt.or('⚠ Alt mancante') }}"
            max: 1
            width: 1/2

      contenuto:
        label: Contenuto
        type: fields
        fields:
          text:
            label: Testo
            type: blocks
            fieldsets:
              - text
              - image
              - video

      correlati:
        type: fields
        fields:
          correlati_headline:
            type: headline
            label: Correlati
          correlati_auto:
            label: Output della stessa tematica
            help: >
              Di default il carosello mostra tutti gli altri output.
              Spegnere per un controllo più granulare
            type: toggle
            default: true
            text:
              - Non mostrare
              - Mostra
          correlati_extra:
            label: Altri output da aggiungere
            help: >
              Output di qualunque tematica, aggiunti dopo quelli della
              stessa tematica (o da soli, se sopra è spento). Trascina per
              cambiare l'ordine.
            type: pages
            multiple: true
            query: site.index.filterBy('intendedTemplate', 'output').not(page)
            info: "{{ page.parent.title }}"
  seo:
    extends: tabs/seo
