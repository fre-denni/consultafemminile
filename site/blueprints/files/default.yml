title: File

# Le foto caricate nel Panel vengono ridotte da sole al momento del
# caricamento (anche quando si sostituisce un file): al massimo 2400px sul
# lato lungo, senza mai ingrandire quelle più piccole. La scala dei derivati
# per il browser (site/plugins/image-derivatives) arriva a 2000px di
# larghezza, quindi 2400px lasciano margine anche su schermi 2x. Non tocca
# PDF, video e SVG, e non cambia il formato del file.
create:
  width: 2400
  height: 2400
  quality: 82

# Testo alternativo: per chi non vede l'immagine (screen reader) e per i
# motori di ricerca. Obbligatorio: il Panel non permette di salvare il file
# senza, e le pagine non si salvano se contengono immagini nuove senza Alt
# (vedi site/plugins/image-alt). Per un PDF scrivi il titolo del documento.
#
# Eccezione: un'immagine "decorativa" (solo ornamento, come quelle generate
# con lo strumento immagini) non ha Alt e sul sito esce con alt="" voluto,
# così chi usa un lettore di schermo la salta. Le immagini create dallo
# strumento immagini del Panel sono già segnate così.
fields:
  decorative:
    label: Immagine decorativa
    help: Valore default per immagini generate. Sono saltate dagli screen reader. Modificare per aggiungere descrizione.
    type: toggle
    text:
      - No
      - Sì
  alt:
    label: Testo alternativo (Alt)
    type: text
    required: true
    maxlength: 200
    when:
      decorative: false
