name: Deploy to Production

on:
  workflow_dispatch:      # va lanciato manualmente da GitHub, tab "Actions"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Aruba production
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          lftp -c "
          set ftp:ssl-force true;
          set ftp:ssl-protect-data true;
          set ssl:verify-certificate no;
          open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" ftps://$FTP_SERVER;
          mirror --reverse --verbose \
            --exclude-glob .git* \
            --exclude-glob content/ \
            --exclude-glob site/accounts/ \
            --exclude-glob site/cache/ \
            --exclude-glob site/sessions/ \
            --exclude-glob media/ \
            . .
          "
