title: Statuto e Regolamento
icon: document

columns:
  main:
    width: 2/3
    sections:
      fields:
        type: fields
        fields:
          text:
            label: Contenuto
            help: >
              Ogni "Sezione di testo" è un articolo (o l'apertura di una
              sezione); i "Divisori" in stile banner separano Statuto e
              Regolamento. Per aggiungere un articolo duplica uno esistente
              e cambia titolo, sottotitolo e testo.
            type: blocks
            fieldsets:
              - text-section
              - divider
              - download-link
              - paragraph
              - heading
              - text
              - list
              - line
          etichetta:
            extends: fields/contact-etichetta
          foto:
            extends: fields/contact-foto
          fotoAlt:
            extends: fields/contact-foto-alt
          credit:
            extends: fields/contact-credit
  sidebar:
    width: 1/3
    sections:
      files:
        label: File
        help: Carica qui il PDF della brochure e le foto; poi selezionali nei blocchi.
        type: files
