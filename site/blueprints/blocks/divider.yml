name: Divisore di sezione
icon: line
preview: fields
wysiwyg: true
fields:
  background:
    extends: fields/background
  style:
    label: Stile
    type: toggles
    default: chapter
    options:
      - value: chapter
        text: Divisore Doppio
      - value: section
        text: Divisore Alto
      - value: banner
        text: Divisore Blu
  heading:
    label: Testo
    type: text
    required: true
