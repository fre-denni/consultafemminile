title: Consulta Femminile di Milano

tabs:
  pagine:
    label: Pagine sito
    sections:
      payoff:
        label: Payoff
        type: fields
        fields:
          payoff:
            extends: fields/payoff
            label: Payoff del sito
            help: >
              Usato come sottotitolo di riserva nelle pagine che non ne
              definiscono uno proprio (vedi bits/title-page).
      pagineNavigazione:
        label: Pagine di navigazione
        help: >
          Pagine principali: trascinale per cambiare l'ordine di
          apparizione nella barra superiore di navigazione. La Home sta
          in cima ma non compare nel menu (il logo porta già lì).
        type: pages
        status: listed
      paginaStoria:
        label: Sottopagina di Chi siamo
        help: >
          "La nostra storia" compare nel menu principale pur essendo una
          sottopagina di Chi siamo, per questo è mostrata qui. Non è
          trascinabile: Kirby disattiva l'ordinamento in un elenco che
          mescola pagine di livelli diversi.
        type: pages
        query: site.index.filterBy('id', 'chi-siamo/timeline')
        createable: false
        sortable: false
        max: 1
      pagineSecondarie:
        label: Pagine secondarie
        help: >
          Raggiungibili solo tramite un link diretto (es. dal footer o da
          un'altra pagina): non compaiono nel menu principale. La pagina
          d'errore (404) è sempre l'ultima.
        type: pages
        query: site.children.unlisted.not('error').add('error')
        sortable: false
      contatti:
        label: Contatti
        help: >
          Email di destinazione, etichetta, foto, testo alternativo e
          credito del form contatti sono unici per tutto il sito e si
          gestiscono nella pagina Contatti qui sotto: il form compare
          uguale in ogni pagina che lo mostra (vedi bits/contact-form).
        type: pages
        query: site.index.filterBy('id', 'chi-siamo/contatti')
        createable: false
        sortable: false
        max: 1

  social:
    label: Social Media
    fields:
      social:
        label: Social
        type: structure
        columns:
          icon:
            width: 1/12
          platform:
            width: 1/3
          url:
            width: 7/12
        fields:
          icon:
            label: Icona
            type: select
            options:
              type: query
              query: site.socialIconOptions
              text: "{{ item.text }}"
              value: "{{ item.value }}"
            help: >
              Aggiungere icona per il footer, non necessario.
          platform:
            label: Piattaforma
            type: text
            required: true
          url:
            label: URL
            type: url
            required: true
