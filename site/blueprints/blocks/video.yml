name: Video
icon: video
# Sostituisce il blocco "Video" di Kirby: solo link YouTube o Vimeo, mostrati
# con gli indirizzi "senza cookie" (vedi site/plugins/video-embed) e caricati
# solo quando si preme "Riproduci". Niente file video né autoplay.
preview: fields
fields:
  url:
    label: Link del video
    type: url
    placeholder: https://www.youtube.com/watch?v=…
    required: true
    validate: videoUrl
  caption:
    label: Didascalia
    type: writer
    inline: true
