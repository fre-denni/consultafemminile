title: Consulta Femminile di Milano

tabs:
  pagine:
    label: Pagine sito
    sections:
      payoff:
        label: Payoff
        type: fields
        fields:
          payoff:
            extends: fields/payoff
            label: Payoff del sito
            help: >
              Usato come sottotitolo di riserva nelle pagine che non ne
              definiscono uno proprio (vedi bits/title-page).
      pagineNavigazione:
        label: Pagine di navigazione
        help: >
          Pagine principali: trascinale per cambiare l'ordine di
          apparizione nella barra superiore di navigazione.
        type: pages
        status: listed
      paginaStoria:
        label: La nostra storia
        type: pages
        query: site.index.filterBy('id', 'chi-siamo/timeline')
        createable: false
        sortable: false
        max: 1
      pagineSecondarie:
        label: Pagine secondarie
        help: >
          Raggiungibili solo tramite un link diretto (es. dal footer o da
          un'altra pagina): non compaiono nel menu principale. La pagina
          d'errore (404) è sempre l'ultima.
        type: pages
        query: site.children.unlisted.not('error').add('error')
        sortable: false
      contatti:
        label: Contatti
        help: >
          Email di destinazione, etichetta, foto, testo alternativo e
          credito del form contatti sono unici per tutto il sito e si
          gestiscono nella pagina Contatti qui sotto: il form compare
          uguale in ogni pagina che lo mostra (vedi bits/contact-form).
        type: pages
        query: site.index.filterBy('id', 'chi-siamo/contatti')
        createable: false
        sortable: false
        max: 1

  social:
    label: Social Media
    fields:
      social:
        label: Social
        type: structure
        columns:
          icon:
            width: 1/12
          platform:
            width: 1/3
          url:
            width: 7/12
        fields:
          icon:
            label: Icona
            type: select
            options:
              type: query
              query: site.socialIconOptions
              text: "{{ item.text }}"
              value: "{{ item.value }}"
            help: >
              Aggiungere icona per il footer, non necessario.
          platform:
            label: Piattaforma
            type: text
            required: true
          url:
            label: URL
            type: url
            required: true

  seo:
    label: SEO
    fields:
      seoHeadline:
        type: headline
        label: Valori predefiniti per i motori di ricerca e i social
      seoDescription:
        label: Descrizione predefinita
        help: >
          Usata nelle pagine che non hanno una descrizione propria e non
          ne ricavano una dal contenuto. Consigliata tra 120 e 160
          caratteri. Se vuota, si usa il payoff del sito.
        type: textarea
        size: small
        maxlength: 160
      seoImage:
        label: Immagine di condivisione predefinita
        help: |
          Mostrata quando una pagina senza immagine propria (es. la home) viene condivisa sui social.

          **1200 × 630 px**, oltre non serve. Nello strumento immagini imposta **400 × 210**: il file esce 4 volte più grande (1600 × 840, stesso rapporto) e il sito lo ritaglia a 1200 × 630.
        type: files
        info: "{{ file.alt.or('⚠ Alt mancante') }}"
        max: 1
        multiple: false
