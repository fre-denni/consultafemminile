title: Tematica

# Una colonna sola, nello stesso ordine della pagina reale (vedi
# tematica.php): immagine di copertina sopra (bits/tema-hero), poi il
# testo (bits/paragraph), poi gli output sotto (bits/output-carousel).
tabs:
  contenuto:
    label: Contenuto
    sections:
      immagini:
        label: Immagini
        help: |
          La prima immagine caricata qui è la copertina della tematica: usata in cima a questa pagina (vedi bits/tema-hero) e nell'accordion della pagina "Tematiche".

          **Copertina: 2000 × 1250 px** (16:10), oltre non serve. **Il file deve chiamarsi `cover.webp`** (dopo il caricamento: ⋯ → Rinomina): con un altro nome la tematica non compare nella home, nel menu e nell'elenco. Nello strumento immagini imposta **500 × 310**: il file esce 4 volte più grande. Viene ritagliata a seconda dello schermo e dell'uso (cima alla pagina, card della home, menu): tieni il soggetto al centro.

          **Altre immagini: 1120 × 840 px** (4:3), nello strumento **280 × 210**: compaiono nel carosello della pagina "Tematiche".
        type: files
        info: "{{ file.alt.or('⚠ Alt mancante') }}"
      testo:
        label: Testo
        type: fields
        fields:
          subtitle:
            label: Sottotitolo
            help: Mostrato in corsivo nell'accordion della pagina "Tematiche" (vedi bits/chapter-accordion).
            type: text
            required: true
          description:
            label: Descrizione
            help: >
              Mostrata sia nell'accordion della pagina "Tematiche" (vedi
              bits/chapter-accordion) sia come paragrafo introduttivo di
              questa pagina, sotto l'immagine di copertina (vedi
              bits/tema-hero e bits/paragraph).
            extends: fields/rich-text
            required: true
      outputs:
        label: Output
        help: >
          Gli articoli collegati a questa tematica, mostrati in un
          carosello sia qui che nella pagina "Tematiche" (vedi
          bits/output-carousel). Crea qui le sottopagine, poi carica
          l'immagine e scrivi il contenuto nella pagina di ognuna.
        type: pages
        template: output
  seo:
    extends: tabs/seo
