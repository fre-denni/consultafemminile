title: Tematica

# Una colonna sola, nello stesso ordine della pagina reale (vedi
# tematica.php): immagine di copertina sopra (bits/tema-hero), poi il
# testo (bits/paragraph), poi gli output sotto (bits/output-carousel).
tabs:
  contenuto:
    label: Contenuto
    sections:
      immagini:
        label: Immagini
        type: files
        info: "{{ file.alt.or('⚠ Alt mancante') }}"
      testo:
        label: Testo
        type: fields
        fields:
          subtitle:
            label: Sottotitolo
            type: text
            required: true
          description:
            label: Descrizione
            extends: fields/rich-text
            required: true
      outputs:
        label: Output
        type: pages
        template: output
  seo:
    extends: tabs/seo
