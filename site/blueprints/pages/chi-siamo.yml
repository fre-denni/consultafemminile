title: Chi siamo

# Come nel sito (vedi chi-siamo.php): in alto la descrizione (Mission),
# poi i blocchi liberi e le sezioni che mostrano contenuto gestito
# altrove, nello stesso ordine in cui compaiono. Una colonna sola nel tab
# "Contenuto"; la SEO ha un tab a parte. Le sezioni di sola consultazione (createable/sortable disattivati,
# un solo risultato fisso) sono un link rapido alla pagina che gestisce
# davvero quel contenuto. Niente campo "Payoff": il titolo è sempre quello
# del sito ($site->payoff() in chi-siamo.php).
tabs:
  contenuto:
    label: Contenuto
    sections:
      descrizione:
        label: Descrizione pagina
        type: fields
        fields:
          mission:
            extends: fields/mission

      blocchi:
        label: Blocchi
        help: Contenuto libero subito sotto il testo introduttivo.
        type: fields
        fields:
          blocchiTitolo:
            type: headline
            label: Blocchi
          text:
            label: Blocchi
            type: blocks
            fieldsets:
              - text
              - paragraph
              - divider
              - contact-form

      storia:
        label: La nostra storia
        help: >
          Introduzione e capitoli si gestiscono nella pagina collegata qui
          sotto (vedi bits/timeline-section) — qui compaiono così come
          sono, senza altre impostazioni.
        type: pages
        query: site.index.filterBy('id', 'chi-siamo/timeline')
        createable: false
        sortable: false
        max: 1

      consiglio:
        label: Consiglio
        help: >
          Il carosello mostra automaticamente le persone con il flag
          "Consigliera" attivo (vedi bits/people-carousel) — gestiscile
          nella pagina collegata qui sotto.
        type: pages
        query: site.index.filterBy('id', 'chi-siamo/persone')
        createable: false
        sortable: false
        max: 1

      associazioni:
        label: Associazioni
        help: >
          La griglia mostra automaticamente le associazioni elencate nella
          pagina collegata qui sotto (vedi bits/associazioni-grid).
        type: pages
        query: site.index.filterBy('id', 'chi-siamo/associazioni')
        createable: false
        sortable: false
        max: 1

      contatti:
        extends: sections/contatti-globali
  seo:
    extends: tabs/seo
