title: Home

columns:
  main:
    width: 2/3
    sections:
      fields:
        type: fields
        fields:
          text:
            label: Contenuto
            type: blocks
            fieldsets:
              - titlepage
              - paragraph
              - divider
              - contact-form
              - heading
              - text
              - list
              - quote
              - line
  sidebar:
    width: 1/3
    sections:
      video:
        label: Video di presentazione
        type: files
        template: video
        max: 1
      carousels:
        label: Sfondo dei caroselli
        type: fields
        fields:
          tematicheBackground:
            label: Tematiche
            extends: fields/background
            default: tinted
          patrocinioBackground:
            label: Con il patrocinio
            extends: fields/background
            default: tinted
          personeBackground:
            label: Consiglio
            extends: fields/background
          associazioniBackground:
            label: Associazioni
            extends: fields/background
            default: tinted
      pages:
        type: pages
        template: default
      files:
        type: files
