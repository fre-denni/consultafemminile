title: Home
icon: home

sections:
  video:
    label: Video
    help: >
      Il video a schermo intero in cima alla pagina, con il titolo "La
      Consulta Femminile di Milano dal 1963" sopra (vedi bits/hero-video).
      Un solo file.
    type: files
    template: video
    max: 1

  descrizioneUno:
    label: Descrizione uno
    type: fields
    fields:
      descrizioneUnoBackground:
        extends: fields/background
      descrizioneUnoLabel:
        label: Etichetta
        help: Testo piccolo sopra il titolo (facoltativo).
        type: text
        placeholder: "es. Chi siamo"
        width: 1/3
      descrizioneUnoHeading:
        label: Titolo
        type: writer
        inline: true
        width: 2/3
      descrizioneUnoGap:
        type: gap
        width: 1/3
      descrizioneUnoTesto:
        label: Testo
        extends: fields/rich-text
        width: 2/3

  descrizioneDue:
    label: Descrizione due
    type: fields
    fields:
      descrizioneDueBackground:
        extends: fields/background
      descrizioneDueLabel:
        label: Etichetta
        help: Testo piccolo sopra il titolo (facoltativo).
        type: text
        placeholder: "es. La nostra missione"
        width: 1/3
      descrizioneDueHeading:
        label: Titolo
        type: writer
        inline: true
        width: 2/3
      descrizioneDueGap:
        type: gap
        width: 1/3
      descrizioneDueTesto:
        label: Testo
        extends: fields/rich-text
        width: 2/3

  tematiche:
    label: Tematiche
    type: fields
    fields:
      tematicheTitolo:
        type: headline
        label: Tematiche
      tematicheHeading:
        label: Titolo sopra il carosello
        help: Es. "I nostri temi". Vuoto per non mostrarlo.
        type: text
      tematicheBackground:
        extends: fields/background
        default: tinted
  tematichePagina:
    label: Pagina collegata
    help: >
      Il carosello mostra automaticamente le pagine pubblicate qui sotto
      (fino a 8, quelle con una copertina).
    type: pages
    query: site.index.filterBy('id', 'tematiche')
    createable: false
    sortable: false
    max: 1

  patrocinio:
    label: Patrocinio
    type: fields
    fields:
      patrocinioTitolo:
        type: headline
        label: Patrocinio
      patrocinioBackground:
        extends: fields/background
        default: tinted
  patrocinioPagina:
    label: Pagina collegata
    help: Il carosello mostra automaticamente le locandine caricate qui.
    type: pages
    query: site.index.filterBy('id', 'patrocinio')
    createable: false
    sortable: false
    max: 1

  persone:
    label: Persone
    type: fields
    fields:
      personeTitolo:
        type: headline
        label: Persone
      personeBackground:
        extends: fields/background
  personePagina:
    label: Pagina collegata
    help: Il carosello mostra automaticamente le persone con il flag "Consigliera" attivo.
    type: pages
    query: site.index.filterBy('id', 'chi-siamo/persone')
    createable: false
    sortable: false
    max: 1

  loghi:
    label: Associazioni
    type: fields
    fields:
      associazioniTitolo:
        type: headline
        label: Associazioni
      associazioniBackground:
        extends: fields/background
        default: tinted
  loghiPagina:
    label: Pagina collegata
    help: Lo showreel mostra automaticamente i loghi delle associazioni elencate qui.
    type: pages
    query: site.index.filterBy('id', 'chi-siamo/associazioni')
    createable: false
    sortable: false
    max: 1
